<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020b19"><title>RAY</title>
<style>
/* Theme tokens: liquid glass by default, graphite + orange when the TV skin is metal (html[data-skin]) */
:root{color-scheme:dark;--accent:#24dcff;--accent2:#3d8bff;--ink:#eaf7ff;--muted:#95b8d2;--line:rgb(130 205 255/22%);--line2:rgb(130 205 255/45%);--glow:rgb(0 180 255/45%);
 --bg1:#09284a;--bg2:#04152a;--bg3:#020916;--glass-a:rgb(70 150 230/24%);--glass-b:rgb(6 26 52/62%);--solid:#071c31;--ok:#3dffb0;--bad:#ff7b7b;
 --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-skin=metal]{--accent:#ff8f2e;--accent2:#ffb15c;--ink:#f4efe9;--muted:#b3a89c;--line:rgb(255 255 255/14%);--line2:rgb(255 160 80/55%);--glow:rgb(255 130 30/40%);
 --bg1:#2a2d33;--bg2:#15171b;--bg3:#0a0b0d;--glass-a:rgb(200 205 215/16%);--glass-b:rgb(20 22 26/70%);--solid:#1a1c20}
html[data-skin=lanterna]{--accent:#ffb347;--accent2:#ffd08a;--ink:#fff6e6;--muted:#d6c3a3;--line:rgb(255 230 190/16%);--line2:rgb(255 190 110/55%);--glow:rgb(255 170 60/38%);
 --bg1:#3a2a4a;--bg2:#1e1630;--bg3:#0e0a18;--glass-a:rgb(255 225 180/16%);--glass-b:rgb(30 20 40/68%);--solid:#221a30}
html[data-skin=astrolabio]{--accent:#ffc35a;--accent2:#ffe09a;--ink:#fbf3df;--muted:#c9b98f;--line:rgb(255 220 150/15%);--line2:rgb(255 200 90/55%);--glow:rgb(255 190 70/36%);
 --bg1:#13285a;--bg2:#0a1636;--bg3:#050b1d;--glass-a:rgb(255 210 120/14%);--glass-b:rgb(8 18 44/70%);--solid:#0c1a3c}
/* generated background art per skin (assets/remote), dimmed so the controls stay readable */
html[data-art] body{background:linear-gradient(rgb(0 0 0/38%),rgb(0 0 0/52%)),var(--art) center/cover no-repeat fixed,var(--bg3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg3)}
body{margin:0;min-height:100dvh;overflow-x:hidden;color:var(--ink);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
 background:radial-gradient(ellipse 90% 50% at 50% 58%,var(--bg1) 0,var(--bg2) 48%,var(--bg3) 82%) fixed}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;left:-30vw;right:-30vw;top:52%;height:46vh;border:1px solid var(--accent2);border-radius:50%;opacity:.3;
 filter:drop-shadow(0 0 14px var(--glow));transform:rotate(-8deg)}
body:after{content:"";position:fixed;z-index:-1;pointer-events:none;left:-20vw;right:-20vw;top:-18vh;height:42vh;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);opacity:.35}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed}
a{color:var(--accent)}
[hidden]{display:none!important}
svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* shared glass surface + haptic-like press */
.circle,.volume button,.keys,.pad,.now-ctl button,.now-search input,.now-search button,.sug button,.apps button,.setting-button,.theme-controls input,.theme-controls select,.offline,.now-head img,.tabs button{
 background:linear-gradient(155deg,var(--glass-a),var(--glass-b));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgb(255 255 255/16%),0 8px 22px rgb(0 0 0/30%)}
.circle:active,.volume button:active,.now-ctl button:active,.now-search button:active,.sug button:active,.apps button:active,.setting-button:active,.keys button:active{transform:scale(.92);border-color:var(--accent);box-shadow:inset 0 0 18px var(--glow),0 0 22px var(--glow)}
.quick button:active{transform:none}.quick button:active .circle{transform:scale(.92);border-color:var(--accent);box-shadow:inset 0 0 18px var(--glow),0 0 22px var(--glow)}

main{width:min(100%,480px);min-height:100dvh;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.brand{height:72px;flex:none;display:grid;place-items:center;align-content:center;gap:0}
.brandmark{width:96px;height:34px;color:var(--accent);filter:drop-shadow(0 0 10px var(--glow))}
h1{margin:0;color:var(--accent);letter-spacing:.42em;font-size:22px;font-weight:600;padding-left:.42em;text-shadow:0 0 18px var(--glow)}
.status{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:2px auto 16px;min-height:28px;padding:4px 14px;border:1px solid var(--line);border-radius:999px;background:rgb(255 255 255/5%);color:var(--muted);font-size:12px;letter-spacing:.02em}
.status:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
#getApk{border:0;background:none;margin:-6px auto 6px;min-height:0;padding:0;text-align:center;display:block;width:auto}
#getApk:before{display:none}
body[data-conn=ok] #status:before{background:var(--ok);box-shadow:0 0 9px var(--ok)}
body[data-conn=down] #status{color:#ffd0d0;border-color:rgb(255 123 123/40%)}
body[data-conn=down] #status:before{background:var(--bad);box-shadow:0 0 9px var(--bad)}
body[data-conn=wait] #status:before{width:12px;height:12px;background:none;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes late{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* connecting / TV not found */
.offline{display:grid;justify-items:center;gap:6px;text-align:center;border-radius:22px;padding:20px 18px;margin:0 0 16px;animation:late .35s 2.4s both}
.offline b{font-size:18px;font-weight:600}.offline span{color:var(--muted);font-size:13px}
.offline button{margin-top:10px;min-height:48px;padding:0 28px;border-radius:999px;border:1px solid var(--accent);background:linear-gradient(180deg,var(--glow),transparent);color:var(--ink);font-weight:600}
body[data-conn=wait] #remote,body[data-conn=wait] #apps,body[data-conn=down] #remote,body[data-conn=down] #apps{opacity:.4;pointer-events:none;filter:saturate(.6)}

.tabs{display:flex;gap:9px;margin:0 auto 18px}
.motion-toggle{display:none;margin:-4px auto 12px;min-height:40px;border:1px solid var(--line2);background:rgb(255 255 255/5%);border-radius:999px;color:var(--accent);padding:0 16px;font-size:13px}
.native-motion .motion-toggle{display:block}
.motion-toggle[aria-pressed=true]{background:var(--glow);color:#fff}
.motion-state{text-align:center;color:var(--muted);font-size:12px;margin:-5px 0 10px}

.panel{display:none}.panel.active{display:block;animation:rise .3s ease both}
/* remote: no touchpad, controls sit low near the thumb */
#pad{display:none!important}#remote.active{display:flex;flex-direction:column;flex:1}#remote>*{flex:none;width:100%}#remote .media{margin-top:auto}

/* remote */
.circle{border-radius:50%;display:grid;place-items:center;color:#fff}
.media{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,28px);margin:2px 0 22px}
.media button{width:clamp(68px,19vw,80px);height:clamp(68px,19vw,80px)}
.media button:nth-child(2){width:clamp(80px,23vw,94px);height:clamp(80px,23vw,94px);border:2px solid var(--accent);box-shadow:inset 0 0 22px var(--glow),0 0 24px var(--glow)}
.media svg,.quick svg,.nav svg,.now-ctl svg{width:28px;height:28px}
.quick{display:flex;justify-content:center;gap:clamp(24px,9vw,46px);margin-bottom:24px}
.quick button{border:0;background:none;padding:0;color:var(--muted);display:grid;justify-items:center;gap:8px;font-size:12px;letter-spacing:.04em}
.quick .circle{width:clamp(64px,19vw,76px);height:clamp(64px,19vw,76px)}.quick svg{width:30px;height:30px}

.dpad-wrap{display:flex;justify-content:center;align-items:center;gap:14px;margin:0 auto 18px;max-width:100%}
.keys{position:relative;flex:1;min-width:0;max-width:280px;aspect-ratio:1;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 26px var(--glow),inset 0 0 34px var(--glow),inset 0 1px 0 rgb(255 255 255/18%)}
.keys span{display:none}
.keys button{position:absolute;width:22%;height:22%;border:0;background:none;border-radius:50%;padding:0;color:#d6f1ff;display:grid;place-items:center}
.keys button svg{width:26px;height:26px}
.keys [data-c=up]{left:39%;top:3%}.keys [data-c=down]{left:39%;bottom:3%}.keys [data-c=left]{left:3%;top:39%}.keys [data-c=right]{right:3%;top:39%}
.keys button:active{background:radial-gradient(circle,var(--glow),transparent 70%);color:var(--accent)}
.keys [data-c=ok]{left:27%;top:27%;width:46%;height:46%;font-size:26px;font-weight:700;letter-spacing:.06em;color:#fff;border:1px solid var(--line2);
 background:radial-gradient(circle at 50% 35%,rgb(255 255 255/18%),var(--glow) 55%,rgb(0 0 0/25%));box-shadow:0 0 18px var(--glow),inset 0 1px 0 rgb(255 255 255/30%)}
.volume{display:grid;gap:8px;justify-items:center;flex:none;padding:8px;border-radius:24px;background:linear-gradient(180deg,var(--glass-a),transparent);border:1px solid var(--line)}
.volume button{width:56px;height:56px;border-radius:18px;font-size:28px;line-height:1;color:#fff}
.volume span{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}.volume b{font-size:18px;color:var(--ink)}
.pad{height:64px;border-radius:20px;color:var(--muted);display:grid;place-items:center;touch-action:none;user-select:none;margin:0 auto 12px;width:100%;font-size:12px;letter-spacing:.2em;text-transform:uppercase}

/* forms */
.control{margin:16px 0 6px}.control label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}
input[type=range]{width:100%;height:32px;accent-color:var(--accent)}
.focus,.device-name{color:var(--muted);font-size:13px}
.settings{display:grid;gap:14px}
.setting-button{width:100%;min-height:52px;padding:12px 16px;border-radius:16px;text-align:left;color:var(--ink);font-weight:500}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.apps button{min-height:52px;padding:10px 12px;border-radius:16px;text-align:center;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.theme-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.theme-controls label{display:grid;gap:7px;color:var(--muted);font-size:13px}
.theme-controls input,.theme-controls select{width:100%;min-width:0;min-height:48px;border-radius:12px;color:var(--ink);padding:8px 10px}
.theme-controls input[type=color]{padding:5px}
.theme-controls select option{background:#071c31;color:#eaf7ff}
.theme-controls .apps{grid-column:1/-1}
#vpnStatus{margin:0 0 8px;color:var(--muted);font-size:13px}
#deviceLink,#deviceLinkAlt{display:inline-block;padding:10px 0;font-weight:500}

/* app companion */
.now{display:grid;gap:16px;animation:rise .3s ease both}
.now-head{display:grid;gap:14px;justify-items:center;text-align:center}
.now-head img{width:min(72%,260px);aspect-ratio:16/9;object-fit:cover;border-radius:20px;box-shadow:0 14px 40px rgb(0 0 0/50%),0 0 30px var(--glow)}
.now-head h2{font-size:20px;font-weight:600;margin:2px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now-head p{margin:0}.now-head>div{min-width:0;max-width:100%}
.now-bar{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.now-bar input{flex:1;min-width:0}
.now-ctl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.now-ctl button{flex:1;min-width:0;min-height:56px;border-radius:18px;font-size:15px;font-weight:600;display:grid;place-items:center}
.now-ctl #nowPlay{flex:none;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 20px var(--glow),0 0 24px var(--glow)}
#nowPlay svg{width:30px;height:30px;fill:currentColor;stroke:none}#nowPlay .i-pause{display:none}#nowPlay.on .i-pause{display:block}#nowPlay.on .i-play{display:none}
.now-ctl svg{fill:currentColor;stroke:currentColor;stroke-width:2.4}
.now-search{display:flex;gap:8px}
.now-search input{flex:1;min-width:0;min-height:52px;border-radius:999px;padding:0 18px;font:inherit}
.now-search input::placeholder{color:var(--muted)}
.now-search button{width:56px;min-height:52px;border-radius:50%;display:grid;place-items:center;padding:0}.now-search svg{width:22px;height:22px}
.sug{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sug button{border-radius:16px;padding:0;overflow:hidden;text-align:left;font-size:12px}
.sug img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--bg3)}
.sug span{display:block;padding:8px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#nowSugTitle:empty,.now-head img[style*="hidden"],.sug img:not([src]){display:none}
#nowSugTitle,#nowHint{margin:0}

/* app grid */
#appsList{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#appsList button{display:grid;justify-items:center;align-content:start;gap:8px;padding:12px 6px;min-height:96px;font-size:12px}
#appsList .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:21px;font-weight:700;color:#fff;border:1px solid var(--line2);
 background:radial-gradient(circle at 35% 25%,rgb(255 255 255/22%),var(--glow) 60%,rgb(0 0 0/25%))}
#appsList .nm{max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
#focus{margin:0 0 12px;text-align:center}

/* bottom navigation: floating glass pill */
.nav{position:fixed;z-index:2;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),456px);height:68px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-radius:26px;
 background:linear-gradient(180deg,var(--glass-a),var(--glass-b)),rgb(3 10 20/70%);border:1px solid var(--line);box-shadow:0 12px 32px rgb(0 0 0/50%),inset 0 1px 0 rgb(255 255 255/14%);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.nav button{background:none;border:0;border-radius:20px;color:#a7c3dc;display:grid;justify-items:center;align-content:center;gap:3px;font-size:11px;letter-spacing:.03em;min-width:0}
.nav button:active{transform:scale(.94)}
.nav button.active{color:var(--accent);background:linear-gradient(180deg,var(--glow),transparent 90%);box-shadow:inset 0 0 0 1px var(--line2),0 0 16px var(--glow)}
.nav svg{width:24px;height:24px}

@media(max-height:760px){.brand{height:56px}.brandmark{height:26px}.media{margin-bottom:14px}.quick{margin-bottom:14px}.dpad-wrap{margin-bottom:12px}.keys{max-width:236px}.pad{height:48px}}
@media(max-width:380px){.theme-controls{grid-template-columns:1fr}main{padding-left:14px;padding-right:14px}.now-ctl button{font-size:13px}.now-ctl #nowPlay{width:68px;height:68px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.circle:active,.volume button:active,.now-ctl button:active,.apps button:active,.keys button:active,.quick button:active .circle,.nav button:active{transform:none}}
</style>
<main>
  <header class="brand"><svg class="brandmark" viewBox="0 0 160 56" aria-hidden="true"><path fill="currentColor" stroke="none" d="M80 2C65 22 48 24 2 20c31 7 47 6 62 8 5 1 10 8 16 24 6-16 11-23 16-24 15-2 31-1 62-8-46 4-63 2-78-18z"/></svg><h1>RAY</h1></header>
  <p id="getApk" class="status" hidden><a href="/ray.apk" download>Download the Android app</a> · <a href="https://github.com/MadeinTaly/ray-launcher/releases/latest" target="_blank" rel="noopener">GitHub</a></p>
  <p id="status" class="status" role="status">Connecting…</p>
  <div id="offline" class="offline" hidden><b id="offTitle"></b><span id="offSub"></span><button id="retry" type="button"></button></div>
  <button class="motion-toggle" id="motionMode" aria-pressed="false">Motion · Off</button><p class="motion-state" id="motionState" hidden></p>
  <section class="panel active" id="remote">
    <div class="media"><button class="circle" data-media="MEDIA_REWIND" aria-label="Rewind"><svg viewBox="0 0 32 32"><path d="M15 8 5 16l10 8V8Zm12 0-10 8 10 8V8Z" fill="currentColor" stroke="none"/></svg></button><button class="circle" data-media="MEDIA_PLAY_PAUSE" aria-label="Play or pause"><svg viewBox="0 0 32 32"><path d="M10 8v16M22 8v16" stroke-width="4"/></svg></button><button class="circle" data-media="MEDIA_FAST_FORWARD" aria-label="Fast forward"><svg viewBox="0 0 32 32"><path d="m5 8 10 8-10 8V8Zm12 0 10 8-10 8V8Z" fill="currentColor" stroke="none"/></svg></button></div>
    <div class="quick"><button data-action="back"><span class="circle"><svg viewBox="0 0 32 32"><path d="M26 16H7m9-9-9 9 9 9"/></svg></span><span>Back</span></button><button data-action="home"><span class="circle"><svg viewBox="0 0 32 32"><path d="m4 15 12-10 12 10v13H6V15m7 13V18h6v10"/></svg></span><span>Home</span></button><button data-action="menu"><span class="circle"><svg viewBox="0 0 32 32"><path d="M5 8h22M5 16h22M5 24h22"/></svg></span><span>Menu</span></button></div>
    <div class="dpad-wrap"><div class="keys" aria-label="Directional pad"><span></span><button data-c="up" aria-label="Up"><svg viewBox="0 0 32 32"><path d="m8 20 8-8 8 8"/></svg></button><span></span><button data-c="left" aria-label="Left"><svg viewBox="0 0 32 32"><path d="m20 8-8 8 8 8"/></svg></button><button data-c="ok" aria-label="OK">OK</button><button data-c="right" aria-label="Right"><svg viewBox="0 0 32 32"><path d="m12 8 8 8-8 8"/></svg></button><span></span><button data-c="down" aria-label="Down"><svg viewBox="0 0 32 32"><path d="m8 12 8 8 8-8"/></svg></button><span></span></div><div class="volume"><button data-volume="1" aria-label="Volume up">+</button><button data-volume="-1" aria-label="Volume down">−</button><span>Volume<br><b id="volumeValue">—</b></span></div></div>
    <div class="pad" id="pad" hidden>Touchpad</div>
